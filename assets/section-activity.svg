<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="1200" height="132" role="img" aria-label="Contribution Activity">
  <title>Contribution Activity</title>
  <style>@media (prefers-reduced-motion: reduce) { .petals { display: none; } }</style>
  <defs>
