<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="1200" height="132" role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <style>@media (prefers-reduced-motion: reduce) { .petals { display: none; } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B1E"/><stop offset="0.55" stop-color="#1B1033"/><stop offset="1" stop-color="#2B1442"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="132" fill="url(#fade)"/></mask>
    <pattern id="waves" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="#1B1033" stroke="#8B6FC4" stroke-width="1">
        <circle cx="20" cy="0" r="20"/><circle cx="20" cy="0" r="13"/><circle cx="20" cy="0" r="6"/>
        <circle cx="0" cy="10" r="20"/><circle cx="0" cy="10" r="13"/><circle cx="0" cy="10" r="6"/>
        <circle cx="40" cy="10" r="20"/><circle cx="40" cy="10" r="13"/><circle cx="40" cy="10" r="6"/>
        <circle cx="20" cy="20" r="20"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="6"/>
      </g>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="130" rx="14"/></clipPath>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="132" fill="url(#bg)"/>
    <rect width="1200" height="132" fill="url(#waves)" opacity="0.22" mask="url(#m)"/>
