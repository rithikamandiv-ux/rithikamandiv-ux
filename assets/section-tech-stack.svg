    <g transform="translate(36,31) rotate(-5 35 35)" filter="url(#rough)">
      <rect width="70" height="70" rx="9" fill="#D7263D"/>
      <rect x="5" y="5" width="60" height="60" rx="6" fill="none" stroke="#FFE4E6" stroke-width="1.6" opacity="0.85"/>
