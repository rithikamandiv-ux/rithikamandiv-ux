    <text x="150" y="88" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP','Noto Serif JP','Songti SC',serif" font-weight="700" font-size="54" fill="#FFFFFF" filter="url(#glow)">武器庫</text>
