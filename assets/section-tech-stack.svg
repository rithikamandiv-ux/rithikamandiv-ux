    <g><animateTransform attributeName="transform" type="translate" values="382,-16;426,66;390,150" dur="8.1s" begin="-7.5s" repeatCount="indefinite"/><path d="M0,-7 C4.5,-4 5.5,2 0,7 C-5.5,2 -4.5,-4 0,-7 Z" fill="#F472B6" opacity="0.35" transform="scale(1.18)"><animateTransform attributeName="transform" type="rotate" additive="sum" values="91;-319" dur="8.1s" repeatCount="indefinite"/></path></g>
