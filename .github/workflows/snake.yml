name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # Rebuild straight away when the workflow or the panel script changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Needed so the runner has scripts/build_panels.py.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rithikamandiv-ux
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=#5EEAD4&color_dots=#1A1530,#3B1D5E,#6D28A8,#C026D3,#F472B6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Draws dist/metrics.svg and dist/activity.svg (themed panels).
      - name: Build themed panels
        run: python3 scripts/build_panels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: rithikamandiv-ux
          OUT_DIR: dist

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
